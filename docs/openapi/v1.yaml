openapi: 3.1.0
info:
  title: 007 Resort & Spa API
  version: 0.1.0
  description: >
    Implemented surface of the Laravel API (foundation). Errors are RFC 7807 application/problem+json with a stable `code`.
    Mutating endpoints marked idempotent require an `Idempotency-Key` header. Money is a decimal string. IDs are UUIDv7.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: stable machine-readable code }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { type: object, properties: { field: { type: string }, code: { type: string }, message: { type: string } } }
    LoginRequest:
      type: object
      required: [username]
      properties:
        username: { type: string }
        password: { type: string }
        pin: { type: string }
        deviceId: { type: string, format: uuid }
    TokenResponse:
      type: object
      properties:
        tokenType: { type: string, example: Bearer }
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
        sessionId: { type: string, format: uuid }
        staffId: { type: string, format: uuid }
        displayName: { type: string }
paths:
  /auth/staff/login:
    post:
      summary: Staff login (PASSWORD or PIN). Rate limited; 5 failures lock the account 15 minutes (423 account_locked).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { description: invalid_credentials }
        '423': { description: account_locked }
        '429': { description: too_many_requests }
  /auth/staff/refresh:
    post:
      summary: Rotate refresh token (reuse of a rotated token revokes the whole chain).
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { refreshToken: { type: string } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { description: invalid_refresh_token | refresh_token_expired }
  /auth/staff/logout:
    post: { security: [{ bearer: [] }], summary: Revoke the current session, responses: { '204': { description: No content } } }
  /auth/staff/step-up:
    post:
      security: [{ bearer: [] }]
      summary: Re-verify password/PIN; opens a 5 minute step-up window.
      responses: { '200': { description: verified }, '401': { description: invalid_credentials } }
  /auth/sessions/{id}/revoke:
    post:
      security: [{ bearer: [] }]
      summary: Revoke a session (own session, or any with permission session.revoke).
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Revoked }, '403': { description: permission_denied }, '404': { description: session_not_found } }
  /me:
    get: { security: [{ bearer: [] }], summary: Current staff + effective permissions, responses: { '200': { description: OK } } }
  /audit:
    get: { security: [{ bearer: [] }], summary: 'Audit log (permission audit.view), cursor paginated', responses: { '200': { description: OK } } }
  /audit/verify:
    get: { security: [{ bearer: [] }], summary: Recompute the audit hash chain (permission audit.view), responses: { '200': { description: '{valid, rowsChecked, brokenAtSeq, reason, tailHash}' } } }
  /sync/inbox:
    post:
      summary: Node-to-node. Receive pushed sync events (node credential bearer). Per-event result; at-least-once delivery, exactly-once effect (dedup on eventId).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [events], properties: { events: { type: array, items: { type: object, required: [eventId, eventType, entityType, entityId, entityVersion, sourceNode, occurredAt, payload] } } } } } } }
      responses:
        '200': { description: '{results:[{eventId, result: APPLIED|DUPLICATE|CONFLICT|DEFERRED|FAILED, detail?}]}' }
        '401': { description: invalid_node_token }
        '403': { description: node_mismatch | node_site_mismatch }
        '404': { description: sync_inbox_disabled (Local does not accept pushes) }
        '422': { description: validation_failed }
        '429': { description: too_many_requests }
  /sync/pull:
    get:
      summary: Node-to-node. Serve queued events to the puller (Local polls Cloud). Un-acked events are re-served after the lease.
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: siteId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: '{items:[SyncEvent], nextCursor}' }
        '401': { description: invalid_node_token }
  /sync/pull/ack:
    post:
      summary: Node-to-node (contract extension). Acknowledge served events with the per-event outcome.
      responses: { '200': { description: '{acknowledged:n}' }, '401': { description: invalid_node_token } }
  /sync/heartbeat:
    post:
      summary: Node-to-node. Local heartbeat (nodeId = site UUID). Cloud upserts site_health; sentAt must be within the skew window.
      responses: { '200': { description: '{ackAt, peerReachable, commandsPending, serverVersion}' }, '401': { description: invalid_node_token }, '422': { description: heartbeat_clock_skew | validation_failed } }
  /sync/status:
    get: { security: [{ bearer: [] }], summary: 'Sync/outbox status (permission config.manage)', responses: { '200': { description: 'SyncStatus (+ openConflicts, lastError, sites[])' } } }
  /sync/conflicts:
    get: { security: [{ bearer: [] }], summary: 'List sync conflicts (config.manage); filters status, category, entityType; cursor paginated', responses: { '200': { description: OK } } }
  /sync/conflicts/{id}:
    get: { security: [{ bearer: [] }], summary: 'One conflict with both versions/payloads', responses: { '200': { description: OK }, '404': { description: conflict_not_found } } }
  /sync/conflicts/{id}/resolve:
    post: { security: [{ bearer: [] }], summary: 'Record the human resolution (KEEP_LOCAL|MANUAL|DISMISSED + note). Idempotent, audited. Never force-applies the incoming event.', responses: { '200': { description: OK }, '409': { description: conflict_already_resolved } } }
  /sync/conflicts/{id}/reprocess:
    post: { security: [{ bearer: [] }], summary: 'Re-run the applier for the conflicting event; auto-resolves as REPROCESSED when it now applies. Audited.', responses: { '200': { description: '{outcome, conflict}' } } }
  /sync/outbox:
    get: { security: [{ bearer: [] }], summary: 'Outbox events (filter status, eventType), newest first', responses: { '200': { description: OK } } }
  /sync/outbox/{id}/retry:
    post: { security: [{ bearer: [] }], summary: 'Re-queue a terminal FAILED outbox event. Audited.', responses: { '200': { description: OK }, '409': { description: outbox_event_not_retryable } } }
  /sync/outbox/replay-failed:
    post: { security: [{ bearer: [] }], summary: 'Re-queue every FAILED outbox event and reprocess every FAILED inbox event. Audited.', responses: { '200': { description: '{outboxRequeued, inbox:{reprocessed, applied}}' } } }
  /sync/inbox-events:
    get: { security: [{ bearer: [] }], summary: 'Inbox events (filter result=PENDING|APPLIED|CONFLICT|FAILED)', responses: { '200': { description: OK } } }
  /sync/inbox-events/{id}/reprocess:
    post: { security: [{ bearer: [] }], summary: 'Reprocess one stored inbox event. Audited.', responses: { '200': { description: '{eventId, result, detail?}' } } }
