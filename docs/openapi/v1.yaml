  # ---- Waiter collection (bill, collect, confirm, cash handover, terminals, policy; `x-additive: true`; see docs/WAITER_COLLECTION.md) ----
  /orders/{orderId}/bill:
    post:
      operationId: printBill
      tags:
      - Bills
      summary: Print (or reprint) the pre-bill and freeze the order
      x-additive: true
      x-permission: bill.print
      description: 'Freezes the order (no line/send/discount/void changes, 409 `order_billed`) and returns the 80mm pre-bill, clearly NOT a receipt. A repeat is a reprint (counted, audited). Order `status`
        is unchanged; see `billState`. If the bill was cancelled before and rule `pre_bill_requires_supervisor_if_reopened` is true, an approver or `X-Step-Up-Token` is required (403 `supervisor_required`).
        Errors: 409 `order_state_invalid`, `order_billed`.'
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Pre-bill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/{orderId}/bill/cancel:
    post:
      operationId: cancelBill
      tags:
      - Bills
      summary: Cancel the bill and reopen the order
      x-additive: true
      x-permission: bill.cancel.execute
      description: Holders of `bill.cancel.approve` (supervisor) or a valid `X-Step-Up-Token` reopen at once (200); others create an approval (202, action `bill.cancel`, decide via `/approvals/{id}/decision`).
        409 `collections_pending` while any collection is pending or captured; 409 `bill_not_printed`.
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 255
      responses:
        '200':
          description: Reopened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '202':
          description: Approval requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillCancelPending'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /orders/{orderId}/collections:
    post:
      operationId: collectPayment
      tags:
      - Collections
      summary: Waiter collects money at the table (pending confirmation)
      x-additive: true
      x-permission: payment.collect
      description: 'Creates a payment in `PENDING_CONFIRMATION` (or `AUTHORIZING` for PAY_LINK / Paystack transfer). The order is NOT settled and its captured balance is unchanged; `pendingCollected` rises.
        The caller must be on a tablet checked out to them. Errors: 403 `device_not_checked_out`, `cash_holding_not_allowed`; 409 `collection_disabled`, `order_not_billed`, `order_state_invalid`, `over_collection`,
        `cash_limit_exceeded`, `duplicate_reference`, `concurrency_conflict`; 422 `terminal_unavailable`.'
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
      responses:
        '201':
          description: Collected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResult'
        '200':
          description: 'Replay of an earlier collection with the same client `id` (`Idempotent-Replayed: true`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /payments/{paymentId}/confirm:
    post:
      operationId: confirmCollection
      tags:
      - Collections
      summary: Cashier/supervisor confirms a pending collection
      x-additive: true
      x-permission: payment.confirm
      description: PENDING_CONFIRMATION -> CAPTURED, order settled, receipt issued. Idempotent (a second confirm returns 200 + `Idempotent-Replayed`). Not the collector (403 `self_confirmation_forbidden`).
        409 `payment_state_invalid` (rejected/expired/cancelled), `auto_confirm_only`, `balance_changed`, `cash_session_required`.
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                matchedReference:
                  type: string
                  maxLength: 128
                note:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Confirmed payment + order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
