  # ---- Customer / public surface (module Customer; `x-additive: true`). Credentials: customerAuth (r7c_), serviceToken (r7s_, GET-only public.read), bearerAuth (staff r7a_). ----
  # Existing contract paths ALSO admit customer tokens (ownership enforced -> 404 for others' data): POST /bookings/hold, GET /bookings/{id},
  # POST /bookings/{id}/confirm|cancel|reschedule (customers cannot send tenders), POST /payments/paystack/initialize, GET /payments/paystack/verify/{reference},
  # GET /entitlements/{id}, POST /memberships, GET /memberships/{id}; and customer OR service token: GET /bookings/resources[/{id}/availability] (online-bookable only, no authority
  # config), GET /catalog/products (tickets only, additive `ticketCategory`; `facilityId` = the facility the ticket gives access to), GET /memberships/plans (active only).
  /public/site:
    get:
      operationId: getPublicSite
      tags:
      - Public
      summary: Public site information
      x-additive: true
      security:
      - {}
      description: |-
        Unauthenticated. Name, contact, currency, opening hours and, per facility, whether online booking / tickets are available. `sameDayAvailable` / `siteAvailability.localNodeFresh` reflect the SiteAvailability heartbeat gate (Cloud node only): when the Local node is stale, same-day (immediate-fulfilment) ticket orders are refused with `409 site_offline` while the rest of the site stays available. Cached 15 s.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSite'
        '429':
          $ref: '#/components/responses/TooMany'
  /public/ticket-orders:
    post:
      operationId: createTicketOrder
      tags:
      - Public
      summary: Create an unpaid pool-ticket order
      x-additive: true
      security:
      - customerAuth: []
      description: |-
        Customer token required. The SERVER prices the lines; the owner is always the signed-in customer. Pay with `POST /payments/paystack/initialize {orderIds:[id], amount}`; one QR entitlement per person (valid on `visitDate`) is issued on `PaymentCaptured`. `409 site_offline` for same-day visits when the Local node heartbeat is stale (Cloud node).
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /customer/auth/register:
    post:
      operationId: customerRegister
      tags:
      - Customer
      summary: Register a customer account
      x-additive: true
      security:
      - {}
      description: |-
        Always answers 201 `{verificationRequired:true,email}` (no account enumeration). Sends a 6-digit code + link token by email (valid 30 min, 5 attempts). Naturally idempotent; does not use the Idempotency-Key table because the body carries a password. Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequired'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /customer/auth/verify:
    post:
      operationId: customerVerify
      tags:
      - Customer
      summary: Verify email and sign in
      x-additive: true
      security:
      - {}
      description: |-
        Body `{email, code}` or `{token}`. Returns tokens (`r7c_` access, `r7x_` refresh). Wrong/expired/attempt-exhausted: `422 invalid_verification`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerVerifyRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAuthResult'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /customer/auth/verify/resend:
    post:
      operationId: customerVerifyResend
      tags:
      - Customer
      summary: Resend the verification code
      x-additive: true
      security:
      - {}
      description: |-
        Always 202 (no enumeration); at most one code per minute per account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /customer/auth/login:
    post:
      operationId: customerLogin
      tags:
      - Customer
      summary: Customer sign-in
      x-additive: true
      security:
      - {}
      description: |-
        `401 invalid_credentials`; `403 email_not_verified` (only after a correct password); `403 account_locked` after 5 failures (15 min).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerLoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /customer/auth/refresh:
    post:
      operationId: customerRefresh
      tags:
      - Customer
      summary: Rotate the refresh token
      x-additive: true
      security:
      - {}
      description: |-
        Reuse of a rotated refresh token revokes the whole chain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerAuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /customer/auth/logout:
    post:
      operationId: customerLogout
      tags:
      - Customer
      summary: Sign out
      x-additive: true
      security:
      - customerAuth: []
      description: |-
        Revokes the presented token (`?all=true` every session).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /customer/auth/forgot:
    post:
      operationId: customerForgot
      tags:
      - Customer
      summary: Request a password reset
      x-additive: true
      security:
      - {}
      description: |-
        Always 202. Emails a single-use link token (60 min).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /customer/auth/reset:
    post:
      operationId: customerReset
      tags:
      - Customer
      summary: Set a new password
      x-additive: true
      security:
      - {}
      description: |-
        Consumes the reset token, revokes every session. `422 invalid_reset_token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResult'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /customer/me:
    get:
      operationId: customerMe
      tags:
      - Customer
      summary: Signed-in customer
      x-additive: true
      security:
      - customerAuth: []
      description: |-
        Customer tokens only; staff tokens get 401.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /customer/bookings:
    get:
      operationId: customerBookings
      tags:
      - Customer
      summary: My bookings
      x-additive: true
      security:
      - customerAuth: []
      description: |-
        Bookings of the signed-in customer (newest first), each with `policy`. `filter[status]`, cursor pagination. Ownership is enforced in the query, never by post-filtering.
