          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque or JWT
      description: Staff session access token from `/auth/staff/login`.
    customerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque (r7c_...)
      description: Online customer access token from `/customer/auth/verify|login|refresh`. Never valid on staff endpoints; staff tokens are never valid on customer endpoints.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque (r7s_...)
      description: Website read-only credential (scope `public.read`); GET on public read endpoints only.
    deviceToken:
      type: apiKey
      in: header
      name: X-Device-Token
      description: Registered device secret from `/devices/register`.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: 'Client-generated (UUID recommended), stable across retries of the same logical operation. Replay with
        same key+same body returns the original response (with `Idempotent-Replayed: true`); same key with different body
        -> `422 idempotency_key_reused`. Keys live 72 h.'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag from the last GET/response of the aggregate. Mismatch -> `412`/`409 concurrency_conflict`; missing
        -> `428`.
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: false
      schema:
        type: string
      description: Single-use token from `POST /auth/staff/step-up`, letting a supervisor authorise the action inline.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: '`nextCursor` from previous page.'
  headers:
    ETag:
      description: Entity tag derived from the aggregate `rowVersion`.
      schema:
        type: string
      example: '"v3"'
  responses:
    BadRequest:
      description: Malformed request or missing Idempotency-Key
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.007resort.com/problems/idempotency_key_missing
            title: Malformed request or missing Idempotency-Key
            status: 400
            code: idempotency_key_missing
            detail: Malformed request or missing Idempotency-Key
            correlationId: c1f4e7a2-9b8d-4c33-a1de-6f0a2b7c9d10
    Unauthorized:
      description: Missing, expired or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.007resort.com/problems/unauthenticated
            title: Missing, expired or invalid credentials
            status: 401
            code: unauthenticated
            detail: Missing, expired or invalid credentials
            correlationId: c1f4e7a2-9b8d-4c33-a1de-6f0a2b7c9d10
    Forbidden:
      description: Permission denied or approval required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.007resort.com/problems/permission_denied
            title: Permission denied or approval required
            status: 403
            code: permission_denied
            detail: Permission denied or approval required
            correlationId: c1f4e7a2-9b8d-4c33-a1de-6f0a2b7c9d10
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.007resort.com/problems/not_found
            title: Resource not found
            status: 404
            code: not_found
            detail: Resource not found
            correlationId: c1f4e7a2-9b8d-4c33-a1de-6f0a2b7c9d10
    Conflict:
      description: State or concurrency conflict (concurrency_conflict, insufficient_stock, slot_unavailable, balance_changed,
        order_state_invalid ...)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.007resort.com/problems/concurrency_conflict
            title: State or concurrency conflict (concurrency_conflict, insufficient_stock, slot_unavailable, balance_changed,
              order_state_invalid ...)
            status: 409
            code: concurrency_conflict
            detail: State or concurrency conflict (concurrency_conflict, insufficient_stock, slot_unavailable, balance_changed,
              order_state_invalid ...)
            correlationId: c1f4e7a2-9b8d-4c33-a1de-6f0a2b7c9d10
    Unprocessable:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.007resort.com/problems/validation_failed
            title: Validation failed
            status: 422
            code: validation_failed
            detail: Validation failed
            correlationId: c1f4e7a2-9b8d-4c33-a1de-6f0a2b7c9d10
    TooMany:
      description: Rate limited; honour Retry-After
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.007resort.com/problems/rate_limited
            title: Rate limited; honour Retry-After
            status: 429
            code: rate_limited
            detail: Rate limited; honour Retry-After
            correlationId: c1f4e7a2-9b8d-4c33-a1de-6f0a2b7c9d10
  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUIDv7 in canonical lowercase form.
      example: 0192f6a0-7b1c-7d2e-9a3b-5c4d6e7f8a90
    Money:
      type: string
      pattern: ^-?\d+(\.\d{1,4})?$
      description: Decimal string, up to 4 fractional digits. Never a JSON number.
      example: '1500.0000'
    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 UTC with `Z` suffix.
      example: '2026-09-23T10:15:30.123456Z'
    Problem:
      type: object
      description: RFC 7807 problem details with a stable machine-readable `code`.
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
          example: https://api.007resort.com/problems/insufficient_stock
        title:
          type: string
          example: Insufficient stock
        status:
          type: integer
          example: 409
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'
        errors:
          type: object
          description: Field-level validation errors keyed by JSON pointer-ish field path (camelCase).
          additionalProperties:
            type: array
            items:
              type: string
          example:
            lines.0.quantity:
            - must be at least 1
        approvalId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
            description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
          - type: 'null'
        correlationId:
          type: string
        meta:
          type: object
          additionalProperties: true
          description: Code-specific extra data (e.g. `currentRowVersion`, `availableQuantity`).
    ProblemCode:
      type: string
      enum:
      - unauthenticated
      - token_expired
      - invalid_credentials
      - account_locked
      - device_not_registered
      - device_revoked
      - permission_denied
      - approval_required
      - approval_pending
      - step_up_required
      - validation_failed
      - not_found
      - concurrency_conflict
      - idempotency_key_missing
      - idempotency_key_reused
      - insufficient_stock
      - slot_unavailable
      - hold_expired
      - ticket_used
      - ticket_invalid
      - order_state_invalid
      - payment_state_invalid
      - amount_mismatch
      - balance_changed
      - cash_session_required
      - capability_disabled
      - facility_mismatch
      - offline_not_allowed
      - rate_limited
      - provider_error
      - server_error
      description: Stable, additive enum. Clients must treat unknown values as a generic error of the HTTP status class.
    SystemInfo:
      type: object
      properties:
        service:
          type: string
          example: 007resort-api
        apiVersion:
          type: string
          example: 1.0.0
        deploymentMode:
          type: string
          enum:
          - local
          - cloud
        nodeId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        serverTime:
          $ref: '#/components/schemas/Timestamp'
        timezone:
          type: string
          example: Africa/Lagos
        currency:
          type: string
          enum:
          - NGN
        minClientVersion:
          type: object
          additionalProperties:
            type: string
          example:
            mobile: 0.1.0
            pos: 0.1.0
            kds: 0.1.0
        vatEnabled:
          type: boolean
        realtime:
          type: object
          properties:
            scheme:
              type: string
              enum:
              - ws
              - wss
            host:
              type: string
            port:
              type: integer
            appKey:
              type: string
              description: Public Reverb app key.
          required:
          - scheme
          - host
          - port
          - appKey
      required:
      - service
      - apiVersion
      - deploymentMode
      - serverTime
      - currency
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - down
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
            - ok
            - degraded
            - down
          example:
            database: ok
            redis: ok
            queue: ok
            cloudLink: degraded
        serverTime:
          $ref: '#/components/schemas/Timestamp'
      required:
      - status
    StaffLoginRequest:
      type: object
      properties:
        credentialType:
          type: string
          enum:
          - PASSWORD
          - PIN
          - NFC_CARD
        identifier:
          type: string
          description: Staff username or staff number (PASSWORD, PIN). Omitted for NFC_CARD.
        secret:
          type: string
          description: Password, PIN, or NFC card UID/hash depending on credentialType.
          writeOnly: true
        username:
          type: string
          description: 'LEGACY shape: staff username. Use with `password` or `pin` instead of credentialType/identifier/secret.'
        password:
          type: string
          writeOnly: true
          description: LEGACY
        pin:
          type: string
          writeOnly: true
          description: LEGACY
      anyOf:
      - required:
        - credentialType
        - secret
      - required:
        - username
        - password
      - required:
        - username
        - pin
      description: 'Preferred: `{credentialType, identifier, secret}` (identifier is required for PASSWORD and PIN; NFC_CARD
        carries the card UID in `secret`). Legacy: `{username, password}` or `{username, pin}` is still accepted.'
    Staff:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        displayName:
          type: string
        staffNumber:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
            example: order.create
        facilityIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
            description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
      required:
      - id
      - displayName
      - roles
      - permissions
      description: '`roles` are informational labels; clients MUST gate UI on `permissions`, never role names.'
    SessionRef:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        deviceId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
            description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
          - type: 'null'
      required:
      - id
    AuthResult:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSeconds:
          type: integer
          example: 900
        staff:
          $ref: '#/components/schemas/Staff'
        session:
          $ref: '#/components/schemas/SessionRef'
      required:
      - accessToken
      - refreshToken
      - expiresInSeconds
      - staff
      - session
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
      - refreshToken
    LogoutRequest:
      type: object
      properties:
        allSessions:
          type: boolean
    StepUpRequest:
      type: object
      properties:
        credentialType:
          type: string
          enum:
          - PASSWORD
          - PIN
          - NFC_CARD
        identifier:
          type: string
        secret:
          type: string
          writeOnly: true
        permission:
          type: string
          description: Permission the token will authorise, e.g. `order.void.approve`.
        entityType:
          type: string
        entityId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
      required:
      - credentialType
      - secret
      - permission
    StepUpResult:
      type: object
      properties:
        stepUpToken:
          type: string
          description: Single-use, short-lived. Send as `X-Step-Up-Token` on the sensitive request.
        expiresInSeconds:
          type: integer
          example: 120
        approver:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
              description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
            displayName:
              type: string
          required:
          - id
          - displayName
      required:
      - stepUpToken
      - expiresInSeconds
      - approver
    DeviceKind:
      type: string
      enum:
      - MOBILE_TABLET
      - POS_TERMINAL
      - KDS_SCREEN
      - ENTRANCE_SCANNER
      - ATTENDANCE_TERMINAL
      - SERVER
    DeviceMode:
      type: string
      description: |-
        Explicit client persona the device runs (additive to v1). ATTENDANT (waiter/bartender/cashier tablet), SUPERVISOR (approvals tablet),
        SPORTS_ENTRANCE (QR scanner at the arena gate), SPORTS_STORE (equipment release/return), POS, KDS, ATTENDANCE_TERMINAL.
        Sent at registration (optional; defaults from `kind`) and returned by `GET /devices/{id}`.
      enum:
      - ATTENDANT
      - SUPERVISOR
      - SPORTS_ENTRANCE
      - SPORTS_STORE
      - POS
      - KDS
      - ATTENDANCE_TERMINAL
    Device:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        name:
          type: string
        kind:
          $ref: '#/components/schemas/DeviceKind'
        mode:
          oneOf:
          - $ref: '#/components/schemas/DeviceMode'
          - type: 'null'
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - REVOKED
        facilityId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
            description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
          - type: 'null'
        homeFacilityId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
            description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
          - type: 'null'
        homeFacility:
          description: Summary of the home facility (additive), so a device-token-only client needs no protected lookup.
          oneOf:
          - type: object
            properties:
              id:
                $ref: '#/components/schemas/Uuid'
              code:
                type: string
              name:
                type: string
              kind:
                type: string
          - type: 'null'
        platform:
          type: string
          example: android
        appVersion:
          type: string
        lastSeenAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        checkout:
          oneOf:
          - $ref: '#/components/schemas/DeviceCheckout'
          - type: 'null'
        rowVersion:
          type: integer
      required:
      - id
      - name
      - kind
      - status
    DeviceRegisterRequest:
      type: object
      properties:
        name:
          type: string
          example: Tablet 04
        kind:
          $ref: '#/components/schemas/DeviceKind'
        mode:
          $ref: '#/components/schemas/DeviceMode'
        hardwareId:
          type: string
          description: Stable platform identifier (Android ID / install UUID).
        platform:
          type: string
        appVersion:
          type: string
        registrationCode:
          type: string
          description: One-time code issued by IT admin in the admin UI.
          writeOnly: true
      required:
      - name
      - kind
      - hardwareId
      - registrationCode
    DeviceRegisterResult:
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device'
        deviceToken:
          type: string
          description: Long-lived opaque secret. Store in secure storage; send as `X-Device-Token`. Shown once.
      required:
      - device
      - deviceToken
    DeviceCheckout:
      type: object
      properties:
        staffId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        facilityId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        shiftId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
            description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
          - type: 'null'
        checkedOutAt:
          $ref: '#/components/schemas/Timestamp'
        checkedInAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - staffId
      - facilityId
      - checkedOutAt
    DeviceCheckoutRequest:
      type: object
      properties:
        staffId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        facilityId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        shiftId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        openingFloat:
          $ref: '#/components/schemas/Money'
      required:
      - staffId
      - facilityId
    DeviceCheckinRequest:
      type: object
      properties:
        closingNote:
          type: string
        cashSessionId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
    DeviceStatusReport:
      type: object
      properties:
        appVersion:
          type: string
        batteryPercent:
          type: integer
          minimum: 0
          maximum: 100
        networkType:
          type: string
          enum:
          - WIFI
          - CELLULAR
          - ETHERNET
          - NONE
        queuedMutations:
          type: integer
          description: Offline queue depth.
        oldestQueuedAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        lastSyncedAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        printerStatus:
          type: string
          enum:
          - OK
          - OFFLINE
          - NO_PAPER
          - UNKNOWN
      required:
      - appVersion
    DeviceCommand:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        command:
          type: string
          enum:
          - FORCE_LOGOUT
          - REFRESH_STATE
          - LOCK
          - REVOKE
        issuedAt:
          $ref: '#/components/schemas/Timestamp'
        payload:
          type: object
          additionalProperties: true
      required:
      - id
      - command
      - issuedAt
      - payload
    Site:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        organizationId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        name:
          type: string
          example: 007 Resort & Spa
        timezone:
          type: string
          example: Africa/Lagos
        currency:
          type: string
          enum:
          - NGN
        address:
          type: string
      required:
      - id
      - name
      - timezone
      - currency
    Facility:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        siteId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        parentId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
            description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
          - type: 'null'
        code:
          type: string
          example: RESTAURANT_1
        name:
          type: string
        kind:
          type: string
          description: Facility category, e.g. RESTAURANT, BAR, SPORTS_STORE, SPORTS_ENTRANCE, POOL, RECEPTION, MAIN_STORE.
          example: RESTAURANT
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        capabilities:
          type: array
          items:
            type: string
        rowVersion:
          type: integer
      required:
      - id
      - siteId
      - code
      - name
      - kind
      - status
    FacilityNode:
      allOf:
      - $ref: '#/components/schemas/Facility'
      - type: object
        properties:
          children:
            type: array
            items:
              $ref: '#/components/schemas/FacilityNode'
        required:
        - children
    OperatingPoint:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        facilityId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        code:
          type: string
          example: BAR_COUNTER_1
        name:
          type: string
        kind:
          type: string
          enum:
          - TABLE_AREA
          - COUNTER
          - GATE
          - STORE_WINDOW
          - STATION
          - ROOM
        defaultPrepStationId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
            description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
          - type: 'null'
      required:
      - id
      - facilityId
      - code
      - name
      - kind
    OperatingRules:
      type: object
      properties:
        approvalThresholdAmount:
          $ref: '#/components/schemas/Money'
        requireApprovalFor:
          type: array
          items:
            type: string
            example: order.void
        allowOpenTabs:
          type: boolean
        requireCashSession:
          type: boolean
        allowOfflineOrders:
          type: boolean
        allowOfflinePayments:
          type: string
          enum:
          - NONE
          - CASH_ONLY
          - ALL
        holdTtlSeconds:
          type: integer
        vatEnabled:
          type: boolean
        vatRatePercent:
          type: string
          example: '7.5'
    FacilityCapabilities:
      type: object
      properties:
        facilityId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        capabilities:
          type: array
          items:
            type: string
            example: SELL_FOOD
        operatingRules:
          $ref: '#/components/schemas/OperatingRules'
        version:
          type: integer
      required:
      - facilityId
      - capabilities
      - operatingRules
    StaffMember:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        displayName:
          type: string
        staffNumber:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - TERMINATED
        email:
          type:
          - string
          - 'null'
          format: email
        phone:
          type:
          - string
          - 'null'
        rowVersion:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        siteId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        hasPassword:
          type: boolean
        hasPin:
          type: boolean
        hasNfcCard:
          type: boolean
      required:
      - id
      - displayName
      - status
    Role:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        code:
          type: string
          example: CASHIER
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
      required:
      - id
      - code
      - name
      - permissions
    RoleAssignment:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        staffId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        roleId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        scopeType:
          type: string
          enum:
          - ORGANIZATION
          - SITE
          - FACILITY
        scopeId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        grantedByStaffId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        grantedAt:
          $ref: '#/components/schemas/Timestamp'
        revokedAt:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      required:
      - id
      - staffId
      - roleId
      - scopeType
      - scopeId
    GrantRoleRequest:
      type: object
      properties:
        roleId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        scopeType:
          type: string
          enum:
          - ORGANIZATION
          - SITE
          - FACILITY
        scopeId:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
      required:
      - roleId
      - scopeType
      - scopeId
    Category:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
        parentId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
            description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
          - type: 'null'
        name:
          type: string
        sortOrder:
          type: integer
      required:
      - id
      - name
    PrepRoute:
      type: object
      properties:
