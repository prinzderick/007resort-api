  /prep-tickets/{ticketId}/transition:
    post:
      operationId: transitionPrepTicket
      tags:
      - KDS
      summary: Advance a prep ticket
      x-permission: prep_ticket.transition
      description: |-
        Allowed: NEW->ACCEPTED->IN_PROGRESS->READY->DISPENSED (NEW->IN_PROGRESS and ACCEPTED->READY allowed to skip). Other transitions: `order_state_invalid`. READY on the last ticket moves the order to READY and emits `order.ready`.

        Required permission: `prep_ticket.transition`.
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
            examples:
              accept:
                value:
                  to: ACCEPTED
              ready:
                value:
                  to: READY
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepTicket'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: If-Match precondition failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
