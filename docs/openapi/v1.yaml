  /orders/{orderId}/void:
    post:
      operationId: voidOrder
      tags:
      - Orders
      summary: Void an order (sensitive)
      x-permission: order.void.execute
      description: |-
        Behaviour: (1) caller holds `order.void.approve` or supplies a valid `X-Step-Up-Token` -> `200` and the order is VOIDED. (2) approval required by facility rule -> `202` with `ApprovalOutcome`; the order becomes `PENDING_APPROVAL` and a supervisor decides via `POST /approvals/{id}/decision`. (3) Caller lacks `order.void.execute` -> `403 permission_denied`.

        Required permission: `order.void.execute`.
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidRequest'
            examples:
              v:
                value:
                  reason: Customer left before food arrived
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          description: If-Match precondition failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
        '202':
          description: Approval requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalOutcome'
              examples:
                pending:
                  value:
                    status: PENDING_APPROVAL
                    approval:
                      id: 0192f6a0-7b1c-7d2e-9a3b-5c4d6e7f8a91
                      action: order.void
                      entityType: order
                      entityId: 0192f6a0-0000-7000-8000-000000000601
                      facilityId: 0192f6a0-0000-7000-8000-000000000101
                      status: PENDING
                      requestedByStaffId: 0192f6a0-0000-7000-8000-000000000401
                      requestedByName: Amaka O.
                      requestedAt: '2026-09-23T10:15:30.123456Z'
                      reason: Customer left
                      amount: '9000.0000'
                      summary: Void order RST1-000123 (9,000.00)
                      decidedByStaffId: null
                      decidedAt: null
                      decisionNote: null
                      requiredPermission: order.void.approve
      x-approval-gated: true
