      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
            examples:
              entry:
                value:
                  action: ENTRY
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemResult'
              examples:
                valid:
                  value:
                    result: VALID
                    entitlementId: 0192f6a0-0000-7000-8000-000000000801
                    itemId: 0192f6a0-7b1c-7d2e-9a3b-5c4d6e7f8a90
                    holderName: Chinedu Eze
                    itemName: Tennis Court 1 - 09:00
                    remaining: 0
                    redemptionId: 0192f6a0-7b1c-7d2e-9a3b-5c4d6e7f8a92
                    message: Welcome
                used:
                  value:
                    result: USED
                    entitlementId: 0192f6a0-0000-7000-8000-000000000801
                    itemId: 0192f6a0-7b1c-7d2e-9a3b-5c4d6e7f8a90
                    holderName: Chinedu Eze
                    itemName: Tennis Court 1 - 09:00
                    remaining: 0
