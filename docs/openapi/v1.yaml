        phone: {type: [string, 'null']}
        emailVerified: {type: boolean}
        createdAt: {type: string, format: date-time}
      required: [id, name, email, emailVerified]
    CustomerAuthResult:
      type: object
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        tokenType: {type: string, example: Bearer}
        expiresInSeconds: {type: integer}
        accessTokenExpiresAt: {type: string, format: date-time}
        refreshTokenExpiresAt: {type: string, format: date-time}
        customer: {$ref: '#/components/schemas/Customer'}
      required: [accessToken, refreshToken, customer]
    VerificationRequired:
      type: object
      properties: {verificationRequired: {type: boolean}, email: {type: string}}
    StatusResult:
      type: object
      properties: {status: {type: string}}
    CustomerRegisterRequest:
      type: object
      properties:
        name: {type: string, minLength: 2, maxLength: 120}
        email: {type: string, format: email}
        phone: {type: string}
        password: {type: string, minLength: 10, maxLength: 128}
      required: [name, email, password]
    CustomerVerifyRequest:
      type: object
      properties:
        email: {type: string, format: email}
        code: {type: string, pattern: '^[0-9]{6}$'}
        token: {type: string}
    CustomerLoginRequest:
      type: object
      properties: {email: {type: string, format: email}, password: {type: string}}
      required: [email, password]
    EmailRequest:
      type: object
      properties: {email: {type: string, format: email}}
      required: [email]
    RefreshRequest:
      type: object
      properties: {refreshToken: {type: string}}
      required: [refreshToken]
    ResetRequest:
      type: object
      properties: {token: {type: string}, password: {type: string, minLength: 10}}
      required: [token, password]
    TicketOrderRequest:
      type: object
      properties:
        facilityId: {$ref: '#/components/schemas/Uuid'}
        visitDate: {type: string, format: date}
        lines:
          type: array
          items:
            type: object
            properties: {productId: {$ref: '#/components/schemas/Uuid'}, quantity: {type: integer, minimum: 1}}
            required: [productId, quantity]
        customer: {type: object, additionalProperties: true, description: ignored; the owner is the signed-in customer}
      required: [facilityId, visitDate, lines]
    TicketOrder:
      type: object
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        number: {type: string}
        facilityId: {$ref: '#/components/schemas/Uuid'}
        status: {type: string}
        channel: {type: string, example: ONLINE}
        visitDate: {type: string, format: date}
        currency: {type: string}
        subtotal: {type: string}
        total: {type: string, description: decimal string}
        amountPaid: {type: string}
        amountDue: {type: string}
        paid: {type: boolean}
        adultCount: {type: integer}
        childCount: {type: integer}
        lines: {type: array, items: {type: object, additionalProperties: true}}
        entitlementIds: {type: array, items: {$ref: '#/components/schemas/Uuid'}}
        createdAt: {type: string, format: date-time}
      required: [id, total, paid]
    BookingPolicy:
      type: object
      description: What the engine would allow right now (same rules as cancel/reschedule enforce).
      properties:
        canCancel: {type: boolean}
        canReschedule: {type: boolean}
        cancelBy: {type: [string, 'null'], format: date-time}
        rescheduleBy: {type: [string, 'null'], format: date-time}
        refundAmount: {type: string}
        cancellationFee: {type: string}
        reschedulesLeft: {type: integer}
        note: {type: [string, 'null']}
    BookingPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Booking'}}
        nextCursor: {type: [string, 'null']}
    EntitlementPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Entitlement'}}
        nextCursor: {type: [string, 'null']}
    MembershipPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Membership'}}
        nextCursor: {type: [string, 'null']}
    ServiceTokenCreated:
      type: object
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        token: {type: string, description: shown once}
        name: {type: string}
        scope: {type: string, example: public.read}
        oldTokenExpiresAt: {type: [string, 'null'], format: date-time}
