      summary: Redeem ENTRY at a facility (scan)
      x-permission: ticket.redeem
      description: |-
        Atomic conditional update (`qty_redeemed < qty`) — of two concurrent scans exactly one gets VALID. Result is in the body; HTTP is 200 for every scan outcome. Facility is checked against the device checkout facility (or `facilityId`). Offline scanners must not fabricate results; see README.

