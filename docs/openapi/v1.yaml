# Copy of 007resort-docs api/openapi/v1.yaml (contract of record, branch api/contract-v1) PLUS the additive endpoints and `DeviceMode` built in this repo (marked `x-additive: true`).
# Change the contract in the docs repo; keep additions here in sync via the integration PRs.
openapi: 3.1.0
info:
  title: 007 Resort & Spa IFOP API
  version: 1.0.0
  summary: Contract of record for backend, mobile, POS, KDS and web clients.
  description: |
    Contract of record for the 007 Resort & Spa platform (Laravel backend, Flutter mobile, Windows POS, KDS, PHP web).

    ## Conventions
    - Base path `/api/v1`; JSON `camelCase`; ids are UUIDv7 strings; timestamps ISO-8601 UTC (`Z`); money is a decimal **string** with currency `NGN`.
    - Every authenticated request carries `Authorization: Bearer <accessToken>` and, from registered devices, `X-Device-Token`.
    - Every mutating request carries `Idempotency-Key`. Mutable aggregates expose `ETag`; updates send `If-Match`.
    - Errors are RFC 7807 `application/problem+json` with a stable `code` (see `ProblemCode`).
    - Lists are cursor paginated: `{ "items": [], "nextCursor": null }`.
    - Permissions are shown as `x-permission` on each operation; clients gate UI on the `permissions` array from login, never on role names.
    - Sensitive actions (void, adjustment, refund, reversal, stock adjustment) return `202` with `ApprovalOutcome` when supervisor approval is required, or accept an `X-Step-Up-Token` for inline supervisor authorisation.
    - Offline creates: `POST /orders`, `POST /orders/{id}/lines`, `POST /tabs` and each tender of `POST /payments` accept an optional client-supplied UUIDv7 `id` (unique per site) plus informational `clientCreatedAt`. Same id and same body replays the original result; same id with a different body is `409 concurrency_conflict`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  contact:
    name: 007 Resort engineering
servers:
- url: /api/v1
  description: Same-origin (node-relative)
- url: http://{host}:8080/api/v1
  description: Local node
  variables:
    host:
      default: 192.168.1.10
- url: https://api.007resort.com/api/v1
  description: Cloud node
security:
- bearerAuth: []
  deviceToken: []
tags:
- name: Website CMS
  description: Public website content (service token) and its admin management (docs/CMS_API.md)
- name: System
  description: Service info and health
- name: Auth
  description: Staff authentication and sessions
- name: Devices
  description: Device registration, tablet checkout, status
- name: Organization
  description: Site, facilities, capabilities
- name: Staff
  description: Staff, roles, role assignments
- name: Catalog
  description: Categories, products, availability
- name: Dining tables
  description: Tables
- name: Orders
  description: Orders and lines
- name: Tabs
  description: Open tabs
- name: Approvals
  description: Supervisor approvals
- name: Payments
  description: Payments, refunds, Paystack
- name: Cash sessions
  description: Cashier drawers
- name: Receipts
  description: Receipt payloads
- name: KDS
  description: Kitchen/bar display
- name: Inventory
  description: Stock
- name: Bookings
  description: Resources and bookings
- name: Entitlements
  description: Tickets, rentals
- name: Memberships
  description: Memberships
- name: Attendance
  description: Biometric attendance
- name: Audit
  description: Audit trail
- name: Reports
  description: Read-only reports
- name: Sync
  description: Local/Cloud sync
- name: Admin
  description: Settings
- name: Realtime
  description: Reverb auth
- name: Bills
  description: Pre-bill printing and order freeze (additive)
- name: Collections
  description: Waiter collection, confirmation, auto-confirm (additive)
- name: Cash handover
  description: Waiter cash-in-hand and handover to the cashier (additive)
- name: Payment terminals
  description: Card terminal registry and adapters (additive)
- name: Collection policy
  description: Per-staff waiter cash-holding policy (additive)
paths:
  /system/info:
    get:
      operationId: getSystemInfo
      tags:
      - System
      summary: Service info and minimum client versions
      description: Unauthenticated. Clients call this on start-up to check `minClientVersion` and `deploymentMode`.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '429':
          $ref: '#/components/responses/TooMany'
      security: []
  /system/health:
    get:
      operationId: getSystemHealth
      tags:
      - System
      summary: Aggregated health (authenticated detail)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooMany'
      security: []
  /health/live:
    get:
      operationId: getLiveness
      tags:
      - System
      summary: Liveness probe
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooMany'
      security: []
      servers:
      - url: /
  /health/ready:
    get:
      operationId: getReadiness
      tags:
      - System
      summary: Readiness probe (DB, Redis, queue)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooMany'
      security: []
      servers:
      - url: /
  /auth/staff/login:
    post:
      operationId: staffLogin
      tags:
      - Auth
      summary: Staff login (password, PIN, or NFC card)
      description: |-
        `X-Device-Token` is required for PIN and NFC_CARD (they are only valid on registered devices) and optional for PASSWORD (admin web). Failed attempts are rate-limited per identifier and device; repeated failures return `account_locked`.

        Problems: `invalid_credentials` (401), `account_locked` (423 mapped as 403), `device_not_registered`/`device_revoked` (403).
      parameters:
      - name: X-Device-Token
        in: header
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
            examples:
              pin:
                summary: PIN on a tablet
                value:
                  credentialType: PIN
                  identifier: S-0042
                  secret: '4821'
              nfc:
                summary: NFC badge
                value:
                  credentialType: NFC_CARD
                  identifier: 04A2246B7C5E80
                  secret: '4821'
              password:
                summary: Admin web
                value:
                  credentialType: PASSWORD
                  identifier: manager@007resort.com
                  secret: '********'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
              examples:
                ok:
                  value:
                    accessToken: <access-token>
                    refreshToken: <refresh-token>
                    expiresInSeconds: 900
                    staff:
                      id: 0192f6a0-0000-7000-8000-000000000401
                      displayName: Amaka Okafor
                      staffNumber: S-0042
                      roles:
                      - WAIT_STAFF
                      permissions:
                      - order.create
                      - order.line.add
                      - order.line.remove_unsent
                      - order.send
                      - tab.view_own_facility
                      facilityIds:
                      - 0192f6a0-0000-7000-8000-000000000101
                    session:
                      id: 0192f6a0-7b1c-7d2e-9a3b-5c4d6e7f8a90
                      expiresAt: '2026-09-23T22:15:30Z'
                      deviceId: 0192f6a0-0000-7000-8000-000000000301
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
  /auth/staff/refresh:
    post:
      operationId: refreshToken
      tags:
      - Auth
      summary: Rotate the access/refresh token pair
      description: Refresh tokens are single-use and rotate; reuse of a consumed refresh token revokes the whole session (`token_expired`/`unauthenticated`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              r:
                value:
                  refreshToken: <refresh-token>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
      security: []
  /auth/staff/logout:
    post:
      operationId: staffLogout
      tags:
      - Auth
      summary: End the current session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logged out
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /auth/me:
    get:
      operationId: getCurrentStaff
      tags:
      - Auth
      summary: Current staff, permissions and session
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    $ref: '#/components/schemas/Staff'
                  session:
                    $ref: '#/components/schemas/SessionRef'
                  device:
                    oneOf:
                    - $ref: '#/components/schemas/Device'
                    - type: 'null'
                required:
                - staff
                - session
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /auth/staff/step-up:
    post:
      operationId: staffStepUp
      tags:
      - Auth
      summary: Supervisor re-authentication for a sensitive action
      description: Verifies the approver credential (may be a different staff member than the session holder) holds `permission`
        at the device facility scope and returns a single-use token for `X-Step-Up-Token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
            examples:
              sup:
                value:
                  credentialType: PIN
                  identifier: S-0007
                  secret: '9911'
                  permission: order.void.approve
                  entityType: order
                  entityId: 0192f6a0-0000-7000-8000-000000000601
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /auth/sessions/{sessionId}/revoke:
    post:
      operationId: revokeSession
      tags:
      - Auth
      summary: Revoke a session (and optionally lock the device)
      x-permission: session.revoke
      description: 'Required permission: `session.revoke`.'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /devices/register:
    post:
      operationId: registerDevice
      tags:
      - Devices
      summary: Register a device with a one-time registration code
      description: Registration code is issued by an IT admin (`device.register`). Returns the `deviceToken` exactly once.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
      security: []
  /devices:
    get:
      operationId: listDevices
      tags:
      - Devices
      summary: List devices
      x-permission: device.register
      description: 'Required permission: `device.register`.'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: filter[status]
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - REVOKED
      - name: filter[facilityId]
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /devices/{deviceId}:
    get:
      operationId: getDevice
      tags:
      - Devices
      summary: Get a device
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooMany'
    patch:
      operationId: updateDevice
      tags:
      - Devices
      summary: Edit a device (name, home facility, operating point, mode)
      x-permission: 'device.manage'
      x-additive: true
      description: |-
        Required permission: `device.manage`.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '412':
          description: 'Stale If-Match (concurrency_conflict); nothing changed.'
        '428':
          description: 'If-Match header missing (concurrency_conflict).'
  /devices/{deviceId}/checkout:
    post:
      operationId: checkoutDevice
      tags:
      - Devices
      summary: Tablet checkout to staff + facility + shift
      description: Binds the device to a staff member, facility and shift. Facility must be within the staff member's role-assignment
        scope. Fails `409 concurrency_conflict` if the device is already checked out.
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCheckoutRequest'
            examples:
              c:
                value:
                  staffId: 0192f6a0-0000-7000-8000-000000000401
                  facilityId: 0192f6a0-0000-7000-8000-000000000101
                  shiftId: 0192f6a0-7b1c-7d2e-9a3b-5c4d6e7f8a90
                  openingFloat: '0.0000'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /devices/{deviceId}/checkin:
    post:
      operationId: checkinDevice
      tags:
      - Devices
      summary: Return the tablet (end of shift)
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCheckinRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /devices/{deviceId}/status:
    post:
      operationId: reportDeviceStatus
      tags:
      - Devices
      summary: Device status / heartbeat report
      description: Called every ~60 s while online. Response carries any pending device commands.
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStatusReport'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusReportAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /devices/{deviceId}/revoke:
    post:
      operationId: revokeDevice
      tags:
      - Devices
      summary: Revoke a device
      x-permission: device.revoke
      description: 'Required permission: `device.revoke`.'
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /organization/site:
    get:
      operationId: getSite
      tags:
      - Organization
      summary: The site this node serves
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /organization/facilities:
    get:
      operationId: listFacilityTree
      tags:
      - Organization
      summary: Facilities as a tree
      description: Not paginated; bounded by site size. Returns only facilities within the caller's scope.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FacilityNode'
                required:
                - items
              examples:
                t:
                  value:
                    items:
                    - id: 0192f6a0-0000-7000-8000-000000000101
                      siteId: 0192f6a0-7b1c-7d2e-9a3b-5c4d6e7f8a90
                      parentId: null
                      code: RESTAURANT_1
                      name: Main Restaurant
                      kind: RESTAURANT
                      status: ACTIVE
                      capabilities:
                      - SELL_FOOD
                      - TABLE_SERVICE
                      rowVersion: 4
                      children: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
    post:
      operationId: createFacility
      tags:
      - Organization
      summary: Create a facility (optionally from a template)
      x-permission: 'facility.manage'
      x-additive: true
      description: |-
        Creates the facility with the template's capabilities, default operating rules and starter operating points. `code` is unique per site for ever. Audited; emits `ConfigurationUpdated` (`facilityFull`).

        Required permission: `facility.manage`.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilityCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityDetail'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /organization/facilities/{facilityId}:
    get:
      operationId: getFacility
      tags:
      - Organization
      summary: Get a facility
      parameters:
      - name: facilityId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
          description: Public role UUID (`role.public_id`). Role ids in every response are UUIDs.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facility'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
