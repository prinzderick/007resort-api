name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    # TODO(phase-1): integration tests against a real MySQL 8.4 are planned via Testcontainers
    # (which needs no service container). If a service container is preferred instead:
    # services:
    #   mysql:
    #     image: mysql:8.4
    #     env:
    #       MYSQL_DATABASE: r007_test
    #       MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
    #     ports: ["3306:3306"]
    #     options: >-
    #       --health-cmd="mysqladmin ping -h 127.0.0.1"
    #       --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore R007.sln

      - name: Build
        run: dotnet build R007.sln -c Release --no-restore

      - name: Test
        run: dotnet test R007.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
